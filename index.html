<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<div class="container">
<body>
    <div id="gameContainer">
        <canvas id="gameBoard" width="500" height="500"></canvas>
        <div id="scoreText">0</div>
        <button id="resetBtn">Reset</button>
    </div>

    <div id="mobileControls">
    <div class="dpad">
        <!-- Up -->
        <button class="ctrl-btn up">N</button>

        <!-- Middle row (Left & Right) -->
        <div class="horizontal-controls">
            <button class="ctrl-btn left">W</button>
            <button class="ctrl-btn right">E</button>
        </div>

        <!-- Down -->
        <button class="ctrl-btn down">S</button>
    </div>
</div>
    <audio id="startSound" src="Rattle Snake Attack - Sound Effect.mp3" ></audio>
    <audio id="eatSound" src="Rattle Snake Attack - Sound Effect.mp3"></audio>
    <script src="script.js"></script>
</body>
</div>
</html>
